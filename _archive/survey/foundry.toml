# LanternSurvey: the mission-results ledger next to Lantern (finds and checks).
# Shares forge-std and the Lantern source with ../contracts.
[profile.default]
src = "src"
out = "out"
libs = ["../contracts/lib"]
allow_paths = [".."]
remappings = ["forge-std/=../contracts/lib/forge-std/src/", "lantern/=../contracts/src/"]
solc = "0.8.28"
evm_version = "cancun"   # same as ../contracts/foundry.toml
optimizer = true
optimizer_runs = 200
via_ir = true            # the Assay struct is wide; IR avoids stack-too-deep

[fmt]
line_length = 100

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
