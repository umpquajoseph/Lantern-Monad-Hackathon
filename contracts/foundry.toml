[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Monad is EVM-compatible through the Pectra/Prague fork (docs.monad.xyz, EIP-7702 page),
# so Cancun bytecode is safe on both testnet and mainnet.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
